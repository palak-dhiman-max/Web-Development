<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="card">
        <div class="search">
            <input class="search-box" type="text" placeholder="Search">
         
         <button class="search-btn">  <i class='bx bx-search'></i> 
         
        </div>
       <div class="error"></div>

        <div class="weather">

   <img class="cloud"  src="https://cdn.vectorstock.com/i/1000v/82/33/sun-cloud-icon-vector-9848233.jpg" alt="">
        <h1 class="temp">22°C</h1>
        <h2 class="city">New York</h2>

        <div class="container">

         <div class="col1">
            <img src="https://e7.pngegg.com/pngimages/463/166/png-clipart-moisture-computer-icons-humidity-others-miscellaneous-cdr.png" alt="">
        <div><h2 class="humidity">64%</h2>
            <h3>Humidity</h3>
            </div>

         </div>
         
         <div class="col2">
            <img src="https://www.shutterstock.com/image-vector/wind-speed-icon-winds-clouds-260nw-2288310333.jpg" alt="">
         <div><h2 class="wind">18 km/h</h2>
            <h3>Wind Speed</h3>
            </div>
         </div>
</div>


</div>
    </div>

    

    <script src="script.js"></script>
</body>
</html>
