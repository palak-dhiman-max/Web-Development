 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astrology</title>
 </head>
 <body style="background-color: rgb(125, 211, 233);color: white;display: flex;justify-content: center;align-items: center;height: 100vh;">
    <div id="div" style="height: 640px; width: 400px; background-color: rgb(23, 23, 94);border-radius: 10px;">

    <h1 style="margin: 50px;">Astrology Insights</h1>

    <form style="margin: 35px;">
    <label >First Name</label><br>
    <input id ="name"type="text" style="height: 30px; width: 300px;border-radius: 10px;">
    <br><br>
     <label >Surname</label><br>
    <input id="surname"type="text" style="height: 30px; width: 300px;border-radius: 10px;">
    <br><br>
     <label >Date of Birth (Day)</label><br>
    <input  id="date" type="text" style="height: 30px; width: 300px;border-radius: 10px;">
    <br><br>
     <label >Month</label><br>
    <input id="month" type="number" style="height: 30px; width: 300px;border-radius: 10px;">
    <br><br>
     <label >Year</label><br>
    <input type="number" style="height: 30px; width: 300px;border-radius: 10px;">
    <br><br>
    <input type="submit" value="Get Insights" style="height:35px ;width: 310px;border-radius: 10px;background-color: skyblue;">
    </form>

    <div id="result" style="height: 30px;background-color: rgb(67, 67, 163); width: 310px;margin: 35px;"></div>
    </div>
    <script src="./project7.js"></script>
 </body>
 </html>
